<style>
/* Mặc định tối; data-theme="light" (nút ☀️ trên thanh trên, lưu ở dua-ngong-theme) thì sáng */
:root{
  --bg:#141A10; --ink:#EEF4E2; --muted:#A8B79A; --card:#1E2618; --line:#34422A;
  --grass-a:#4E7A2A; --grass-b:#446D24; --btn:#F29A2E; --btn-ink:#141A10; --accent:#F29A2E; --frame:#5E7D44;
  --red:#E4572E; --blue:#2E86DE;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#EEF4E2; --ink:#1F2A16; --muted:#5C6B4E; --card:#FFFFFF; --line:#C9D8B4;
  --grass-a:#8CC152; --grass-b:#7DB344; --btn:#1F2A16; --btn-ink:#FFFFFF; --frame:#1F2A16;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:16px}
button,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
section[hidden],[hidden]{display:none!important}
.stack{display:flex;flex-direction:column;gap:14px}

.top{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:22px}
.brand{width:36px;height:36px;display:block;flex:none}
:root[data-theme="light"] .brand{background:#1F2A16;border-radius:50%;padding:3px} /* logo pastel nhạt trên nền sáng nên đặt trên nền tròn tối */
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:12px;width:42px;height:42px;font-size:18px}

h1{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(40px,12vw,60px);line-height:.95;margin:4px 0 0}
.lede{margin:0;font-size:16px;line-height:1.55;color:var(--muted);max-width:40ch}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{appearance:none;border:0;background:transparent;border-radius:10px;padding:10px 8px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.sub{font-weight:700;font-size:15px;margin:0 0 -6px}
.field-wrap{display:flex;flex-direction:column;gap:8px}
.field-wrap label{font-weight:700;font-size:15px;display:flex;justify-content:space-between}
.field-wrap label span{color:var(--muted);font-weight:400}
textarea{width:100%;min-height:170px;resize:vertical;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.5}
.hint{font-size:13px;color:var(--muted);margin:0}
.error{color:#D92D3A;font-weight:600;font-size:14px;margin:0;min-height:1em}
.cta{appearance:none;border:0;background:var(--btn);color:var(--btn-ink);font-family:"Baloo 2",sans-serif;font-weight:800;font-size:22px;padding:14px 18px 10px;border-radius:16px}
.cta:active{transform:translateY(2px)}
.ghost{appearance:none;background:transparent;border:2px solid var(--line);border-radius:14px;padding:11px 14px;font-weight:700;font-size:15px}
.actions{display:grid;gap:10px}

.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.box .sub{margin:0}
.muted{color:var(--muted);font-weight:400}
.pair{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
select{font:inherit;font-size:15px;padding:9px 6px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0}
.add{appearance:none;border:0;background:var(--btn);color:var(--btn-ink);border-radius:10px;padding:0 14px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:14px}
.chip.gone{opacity:.45;text-decoration:line-through}
.chip button{appearance:none;border:0;background:transparent;font-size:13px;width:26px;height:26px;border-radius:50%}
.divider{height:1px;background:var(--line);margin:2px 0}
.toggle{display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px}
.toggle input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.hide-num .badge{display:none}
.ropes{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}

/* Sprite */
.spr{display:block;background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
.goose{position:absolute;left:0;top:0;z-index:3;will-change:transform}
.goose .spr{width:100%;height:100%}
.badge{position:absolute;left:4%;top:50%;transform:translateY(-10%);min-width:15px;height:15px;padding:0 3px;border-radius:5px;color:#fff;font-size:10px;font-weight:800;line-height:12px;text-align:center;border:1.5px solid #1b1b1b;z-index:1}
.gname{position:absolute;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7),0 0 4px rgba(0,0,0,.35);pointer-events:none}
.bubble{position:absolute;bottom:55%;left:88%;font-size:12px;font-weight:800;background:#fff;color:#1b1b1b;border-radius:8px;padding:1px 6px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none;z-index:2}
.bubble.on{opacity:1}
.crown{position:absolute;top:-8px;left:40%;font-size:14px;z-index:2;pointer-events:none}

/* Đua Ngỗng (mode give) */
.mini{position:relative;height:22px;background:var(--card);border:2px solid var(--line);border-radius:999px}
.mini i{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;margin:-5.5px 0 0 -5.5px;border:1.5px solid #1b1b1b}
.mini b{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:13px}
.track-wrap{position:relative;overflow:hidden;border:3px solid var(--frame);border-radius:16px;background:var(--grass-a)}
.world{position:absolute;left:0;top:0}
.lane{position:absolute;left:0;right:0}
.lane.a{background:var(--grass-a)} .lane.b{background:var(--grass-b)}
.marker{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed rgba(255,255,255,.55);z-index:1}
.marker span{position:absolute;top:3px;left:5px;font-size:11px;font-weight:800;color:#fff;background:rgba(0,0,0,.28);padding:0 6px;border-radius:6px;white-space:nowrap}
.startline{position:absolute;top:0;bottom:0;width:4px;background:#fff;opacity:.85;z-index:1}
.finish{position:absolute;top:0;bottom:0;width:16px;z-index:1;background:repeating-conic-gradient(#1b1b1b 0 25%,#fff 0 50%) 0 0/16px 16px}
.deco{position:absolute;font-size:12px;opacity:.8;z-index:0;pointer-events:none}
.mode-give .gname{right:88%;top:50%;transform:translateY(-50%);font-size:12px;max-width:130px}
.countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;pointer-events:none}
.countdown span{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:84px;white-space:nowrap;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35);opacity:0}
.countdown span.pop{animation:pop .7s ease-out forwards}
@keyframes pop{0%{transform:scale(.5);opacity:0}30%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:0}}
.status{margin:0;font-size:15px;color:var(--muted);min-height:1.5em;text-align:center}

/* Team field */
.pasture{position:relative;overflow:hidden;border:3px solid var(--frame);border-radius:16px;
  background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.08) 0 2px,transparent 3px) 0 0/28px 28px,var(--grass-a)}
.gate{position:absolute;top:10px;height:76px;border:5px solid #8B5A2B;border-bottom:0;border-radius:10px 10px 0 0;background:rgba(0,0,0,.14);z-index:1}
.gate::before,.gate::after{content:"";position:absolute;bottom:0;height:5px;width:34%;background:#8B5A2B}
.gate::before{left:0} .gate::after{right:0}
.gate .gl{position:absolute;inset:6px 6px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.gate .gl b{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:18px;line-height:1}
.gate .gl span{font-weight:700;font-size:14px}
.gate .flag{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;border:1.5px solid #fff;vertical-align:-1px}
.mode-team .gname{left:50%;top:100%;transform:translateX(-50%);font-size:11px;max-width:92px;margin-top:-3px}
.mode-team .goose.in{transition:transform .45s ease-in,opacity .45s ease-in;opacity:0}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:14px;padding:10px 12px}
.team h3{margin:0 0 6px;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:19px;display:flex;justify-content:space-between;align-items:baseline}
.team h3 small{font-family:"Be Vietnam Pro",sans-serif;font-size:13px;color:var(--muted);font-weight:600}
.team ol{margin:0;padding-left:20px;font-size:14px;line-height:1.6;word-break:break-word}
.team ol:empty::after{content:"Chưa có ai";color:var(--muted);margin-left:-20px}

/* Màn kết quả */
.winner{background:var(--card);border:3px solid var(--frame);border-radius:20px;padding:22px 18px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.winner .g{position:relative;width:160px;height:128px;animation:bounce 1s ease-in-out infinite alternate}
.winner .g .spr{width:100%;height:100%}
.winner .g .badge{font-size:14px;height:22px;line-height:19px;min-width:24px;left:10%}
@keyframes bounce{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-10px) rotate(4deg)}}
.winner p{margin:0;color:var(--muted)}
.winner h2{margin:14px 0 0;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(34px,10vw,52px);line-height:1.15;word-break:break-word}
.rank{margin:0;padding:0;list-style:none;counter-reset:r;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rank li{counter-increment:r;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:15px}
.rank li:last-child{border-bottom:0}
.rank li::before{content:counter(r);font-family:"Baloo 2",sans-serif;font-weight:800;min-width:1.6em;color:var(--muted)}
.rank .sw{width:12px;height:12px;border-radius:3px;flex:none}
@media (prefers-reduced-motion: reduce){
  .winner .g{animation:none}
  .countdown span.pop{animation-duration:.01s}
}

/* Mode picker */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.modes button{text-wrap:balance;appearance:none;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:9px 4px 8px;font-weight:700;font-size:13px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:3px}
.modes button span{font-size:22px;line-height:1}
.modes button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.gate.bottom{top:auto;bottom:10px;border:5px solid #8B5A2B;border-top:0;border-radius:0 0 10px 10px}
.gate.bottom::before,.gate.bottom::after{top:0;bottom:auto}
.gate.bottom .gl{inset:12px 6px 6px}
.gate.narrow .gl b{font-size:15px}
.teams.three{grid-template-columns:1fr 1fr 1fr}
.teams.three .team{padding:8px 9px}
.teams.three .team h3{font-size:16px;flex-direction:column;align-items:flex-start}

/* Survival */
.mode-arena .gname{left:50%;top:100%;transform:translateX(-50%);font-size:11px;max-width:92px;margin-top:-3px}
.hpb{position:absolute;left:18%;right:18%;top:-8px;height:5px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden;z-index:2}
.hpb i{display:block;height:100%;width:100%;background:#6AB04C;transition:width .15s,background .15s}
.vl{position:absolute;left:50%;top:100%;background-image:var(--volam);background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}
.goose.warrior .vl{z-index:1}
.foot{position:absolute;left:50%;bottom:-4px;width:110%;height:9px;border-radius:50%;transform:translateX(-50%);opacity:.8}
.goose.dead{z-index:1;transition:opacity .6s}
.goose.dead .hpb,.goose.dead .foot,.goose.dead .gname{display:none}
.goose.dead.gone{opacity:0}
.winner .g .vl{top:100%}
.goose.hurt .spr{filter:brightness(1.6) sepia(1) saturate(6) hue-rotate(-40deg)}
.goose.hurt .vl{filter:brightness(1.9) saturate(.5)}
.dmg{position:absolute;z-index:6;transform:translate(-50%,0);font-weight:800;font-size:14px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8),0 0 3px rgba(0,0,0,.5);pointer-events:none;white-space:nowrap;animation:dmgup .9s ease-out forwards}
.dmg.crit{font-size:19px;color:#FFD23F}
.dmg.miss{color:#BFD7FF;font-size:12px}
.dmg.heal{color:#7DFF8A}
@keyframes dmgup{0%{opacity:0;margin-top:4px}15%{opacity:1}100%{opacity:0;margin-top:-34px}}
.heart{position:absolute;z-index:2;font-size:18px;transform:translate(-50%,-70%);animation:heartbob 1s ease-in-out infinite alternate;pointer-events:none}
@keyframes heartbob{from{margin-top:0}to{margin-top:-5px}}
.zone{position:absolute;border-radius:50%;pointer-events:none;z-index:1;border:3px dashed transparent;transition:border-color .3s}
.zone.on{border-color:rgba(255,90,70,.9);box-shadow:0 0 0 9999px rgba(200,30,20,.22)}
@media (prefers-reduced-motion: reduce){.dmg{animation-duration:.01s}.heart{animation:none}}
.goose.out{transition:transform .9s cubic-bezier(.2,.7,.3,1),opacity .9s ease-in;opacity:0}
.outs{display:flex;flex-wrap:wrap;gap:6px}
.outs span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted);text-decoration:line-through}
.sub2{margin:0;font-size:14px;font-weight:700;color:var(--muted)}

/* Eggs */
.nest{position:relative;border:3px solid var(--frame);border-radius:16px;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.08) 0 2px,transparent 3px) 0 0/28px 28px,var(--grass-a);padding:16px 10px 18px;display:grid;gap:12px 6px;grid-template-columns:repeat(var(--cols,3),1fr);overflow:hidden}
.eggcell{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.egg{position:relative;width:74%;aspect-ratio:4/5;transform-origin:50% 90%}
.shell{position:absolute;inset:0;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 34% 26%,#fff 0 10%,#F7F0E1 42%,#E2D3B4 100%);border:2px solid rgba(40,30,10,.35)}
.shell.top{clip-path:polygon(0 0,100% 0,100% 48%,88% 56%,75% 46%,62% 56%,50% 46%,38% 56%,25% 46%,12% 56%,0 48%);z-index:2}
.shell.bot{clip-path:polygon(0 48%,12% 56%,25% 46%,38% 56%,50% 46%,62% 56%,75% 46%,88% 56%,100% 48%,100% 100%,0 100%);z-index:2}
.egg .dot{position:absolute;left:50%;bottom:16%;width:20%;aspect-ratio:1;border-radius:50%;transform:translateX(-50%);border:1.5px solid rgba(0,0,0,.3);z-index:3}
.egg svg.crack{position:absolute;inset:0;width:100%;height:100%;z-index:3;overflow:visible}
.egg svg.crack polyline{fill:none;stroke:#4a3514;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.egg.s1{animation:wob1 .18s ease-in-out infinite alternate}
.egg.s2{animation:wob2 .13s ease-in-out infinite alternate}
.egg.s3{animation:wob3 .09s ease-in-out infinite alternate}
@keyframes wob1{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes wob2{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes wob3{from{transform:rotate(-10deg) translateY(-2px)}to{transform:rotate(10deg)}}
.gosling{position:absolute;left:-6%;right:-6%;bottom:22%;aspect-ratio:5/4;z-index:1;transform:scale(0);transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.7,.5,1)}
.gosling.yellow .spr,.winner .g.baby .spr{filter:sepia(1) saturate(5) hue-rotate(-8deg) brightness(1.08);width:100%;height:100%}
.egg.hatched{animation:none}
.egg.hatched .gosling{transform:scale(1)}
.egg.hatched .shell.top{transform:translate(-18%,-80%) rotate(-40deg);opacity:0;transition:transform .7s ease-out,opacity .6s .35s}
.egg.hatched svg.crack,.egg.hatched .dot{opacity:0}
.eggname{font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eggcell.win .eggname{color:#FFE27A}
.mother{position:absolute;left:0;top:0;width:58px;height:46px;z-index:5;pointer-events:none;will-change:transform}
.mother .spr{width:100%;height:100%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.45)) drop-shadow(0 0 1px rgba(0,0,0,.6))}

/* Ring (Ai bao + Vòng quay) */
.ring{position:relative;width:100%;max-width:420px;aspect-ratio:1;margin:0 auto}
.ring.pay{border-radius:50%;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.08) 0 2px,transparent 3px) 0 0/28px 28px,var(--grass-a);border:3px solid var(--frame)}
.ring svg.wheel{position:absolute;inset:0;width:100%;height:100%}
.ring svg.wheel text{font-family:"Be Vietnam Pro",sans-serif;font-weight:700;fill:#1b1b1b}
.ring svg.wheel path.seg{transition:filter .15s}
.ring svg.wheel path.seg.on{filter:brightness(1.18)}
.seat{position:absolute;transform:translate(-50%,-50%);background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;white-space:nowrap;max-width:92px;overflow:hidden;text-overflow:ellipsis;z-index:1;transition:transform .15s,background .15s}
.seat.near{border-color:var(--accent)}
.seat.hit{background:#F29A2E;color:#1b1b1b;border-color:#1b1b1b;transform:translate(-50%,-50%) scale(1.18)}
.seat.skip{opacity:.5}
.ring .goose{z-index:4}
.ring .goose .badge,.ring .goose .gname{display:none}
.mother .badge,.mother .gname,.mother .crown{display:none}

.seg.herd{grid-template-columns:repeat(4,1fr) 1.6fr}
.seg.herd button{font-size:20px;padding:8px 4px}
.seg.herd button[data-herd="mix"]{font-size:14px}
.spr{transform-origin:50% 100%}
.gosling .spr{width:100%;height:100%}

.text-in{width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink)}
.text-in:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ring-token{position:absolute;left:50%;top:50%;width:19%;transform:translate(-50%,-58%);pointer-events:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.ring-token svg{display:block;width:100%;height:auto}
.ring-token span{position:absolute;left:-60%;right:-60%;bottom:-16%;text-align:center;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(11px,3.2vw,15px);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap}

button.ring-token{appearance:none;border:0;background:none;padding:0;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;z-index:3}
button.ring-token:disabled{cursor:default}
.ring-token.armed{pointer-events:auto;animation:tokpulse 1.4s ease-in-out infinite}
@keyframes tokpulse{0%,100%{filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}50%{filter:drop-shadow(0 4px 0 rgba(0,0,0,.25)) drop-shadow(0 0 10px rgba(242,154,46,.9))}}
.power{position:absolute;left:50%;top:50%;width:40%;aspect-ratio:1;transform:translate(-50%,-54%);border-radius:50%;pointer-events:none;z-index:2;
  background:conic-gradient(#F29A2E calc(var(--p,0)*1turn),rgba(0,0,0,.18) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px));mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px));
  opacity:.55;transition:opacity .2s}
.power.on{opacity:1}
.power.spent{opacity:0}
@media (prefers-reduced-motion: reduce){.ring-token.armed{animation:none}}

.ring.slices{border-radius:50%}
.ring svg.wheel path.seg.skip{opacity:.4}
.ring svg.wheel path.seg.win{stroke:#1b1b1b;stroke-width:3;filter:brightness(1.12)}
.ring.slices .ring-token{width:17%}
.ring.slices .power{width:30%}

.list-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.list-head label{flex:1;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:15px}
.list-head label span{color:var(--muted);font-weight:400}
.mini-btn{appearance:none;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px;white-space:nowrap}
.mini-btn:active{transform:translateY(1px)}
textarea.flash{animation:taflash .5s ease-out}
@keyframes taflash{from{border-color:var(--accent)}to{border-color:var(--line)}}

.top-btns{display:flex;gap:8px}
.top-left{display:flex;align-items:center;gap:10px;min-width:0}
#backBtn{font-size:22px;font-weight:700;line-height:1}
.in-game .brand{display:none} /* có nút ← thì bỏ logo cho tên dài khỏi xuống dòng */
#appTitle{overflow:hidden;text-overflow:ellipsis;font-size:clamp(16px,4.6vw,22px)}
.hist-title{margin:0;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:30px}
.hist{display:flex;flex-direction:column;gap:8px}
.hist-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.hist-meta{font-size:12px;color:var(--muted)}
.hist-win{font-weight:700;font-size:16px;word-break:break-word}
.hist-team{font-size:14px;line-height:1.45;word-break:break-word}

/* Giải đấu */
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg button{text-wrap:balance}
.wide .app{max-width:none}
.cup-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.cup-head{min-width:0;flex:1 1 220px}
.cup-head h2{margin:0;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:26px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cup-sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.cup-tools{display:flex;flex-wrap:wrap;gap:6px}
.cup-champ{background:var(--card);border:3px solid var(--accent);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;font-weight:700}
.cup-champ b{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:24px;line-height:1.1;word-break:break-word}
.cup-champ small{display:block;color:var(--muted);font-weight:600}
.cup-champ .cup-cup{font-size:34px}
.cup-view{position:relative;overflow:auto;border:2px solid var(--line);border-radius:16px;background:var(--card);height:calc(100vh - 200px);height:calc(100dvh - 200px);min-height:340px;overscroll-behavior:contain}
.cup-canvas{position:relative}
.cup-canvas svg{position:absolute;left:0;top:0;pointer-events:none}
.cup-canvas path{fill:none;stroke:var(--line);stroke-width:2}
.cup-canvas path.on{stroke:var(--accent)}
.cup-sec{position:absolute;margin:0;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:18px;white-space:nowrap}
.cup-col{position:absolute;margin:0;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.match{position:absolute;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:4px;display:flex;flex-direction:column;gap:4px}
.match.st-ready{border-color:var(--accent)}
.match.st-bye,.match.st-off{opacity:.45}
.match .mno{position:absolute;left:6px;top:-16px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.match.champ{border-color:var(--accent);background:var(--card)}
.slot{display:flex;align-items:stretch;min-height:var(--sh);border-radius:8px;background:var(--card);font-size:var(--fs);font-weight:700;outline-offset:1px}
.slot.empty{align-items:center;padding:0 8px;color:var(--muted);font-weight:500;font-style:italic;border:1.5px dashed var(--line);font-size:calc(var(--fs) * .88);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.slot.win{background:rgba(106,176,76,.28)}
.slot.lose .tcard{opacity:.5}
.slot.lose .tn{text-decoration:line-through}
.slot.drop-ok{outline:3px solid #6AB04C}
.slot.drop-lose{outline:3px solid #E4572E}
.tcard{appearance:none;border:0;background:transparent;color:inherit;font:inherit;display:flex;align-items:center;gap:7px;width:100%;min-width:0;padding:2px 8px;text-align:left;border-radius:8px}
button.tcard{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
button.tcard:hover{background:rgba(242,154,46,.14)}
.tcard .sw{width:10px;height:10px;border-radius:3px;flex:none}
.tcard .tx{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.tcard .tn,.tcard small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard small{font-size:.78em;font-weight:500;color:var(--muted)}
.tcard .crown{margin-left:auto;flex:none}
.wbtn{appearance:none;flex:none;align-self:center;margin:0 4px 0 2px;border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:3px 7px;font:inherit;font-size:calc(var(--fs) * .76);font-weight:800;line-height:1.1;cursor:pointer;white-space:nowrap}
.wbtn:hover{border-color:#6AB04C;color:#8FD06E}
.slot.win .wbtn{background:#6AB04C;border-color:#6AB04C;color:#10200C}
#cupSwap[aria-pressed="true"]{background:var(--accent);color:#1b1b1b;border-color:var(--accent)}
.swap-mode .match.st-bye{opacity:1}
.swap-mode button.tcard.swapable{outline:2px dashed var(--accent);outline-offset:-2px;cursor:pointer}
.swap-mode button.tcard.swapable.hot{background:rgba(242,154,46,.3)}
.tcard.picked{outline:3px solid var(--accent);background:rgba(242,154,46,.18)}
.tcard.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;background:var(--card);border:2px solid var(--accent);box-shadow:0 10px 24px rgba(0,0,0,.35);font-weight:700}
.dropbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(10,14,8,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff}
.dz-name{margin:0;font-weight:700;font-size:14px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dz-row{display:flex;gap:10px;width:100%;max-width:640px}
.dropzone{appearance:none;flex:1;border-radius:16px;padding:16px 8px;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:22px;color:#fff;border:3px dashed;transition:transform .1s}
.dropzone.win{background:#2E6B28;border-color:#9BE07A}
.dropzone.lose{background:#7A2A20;border-color:#F29A80}
.dropzone.draw{background:#3D4A5C;border-color:#A9B8CC}
.dropzone.hot{transform:scale(1.05);border-style:solid}
.dropbar .mini-btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.dropbar.dragging{padding-top:8px;gap:6px}
.dropbar.dragging .dropzone{padding:10px 8px;font-size:19px}
.dropbar.dragging #dzCancel{display:none}
.cup-spacer{height:150px}
.rr{padding:14px;display:flex;flex-direction:column;gap:16px}
.rr table{border-collapse:collapse;font-size:14px;min-width:100%}
.rr th,.rr td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.rr th:nth-child(2),.rr td:nth-child(2){text-align:left}
.rr td.lead{font-weight:800}
.rr-rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px 14px}
.rr-round h4{margin:0 0 8px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rr-round .match{position:relative;margin-top:18px}
.rr-round .match .mno{top:-17px}
.cup-teams{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.cup-teams summary{cursor:pointer;font-weight:700}
.cup-teams ol{margin:8px 0 0;padding-left:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 18px;font-size:14px}
.cup-teams li small{display:block;color:var(--muted)}

.bubble.left{left:auto;right:88%}
.mode-team .bubble.left,.mode-arena .bubble.left,.ring .bubble.left,.mother .bubble.left{right:60%}
</style>
</head>

  <section id="screen-setup" class="stack">
    <div class="modes" role="group" aria-label="Chế độ">
      <button data-mode="give"><span>🎁</span>Đua Ngỗng</button>
      <button data-mode="pass"><span>🎟️</span>Vòng quay may mắn</button>
      <button data-mode="team"><span>⚔️</span>Chia team</button>
      <button data-mode="survive"><span>💥</span>Sinh tồn</button>
      <button data-mode="egg"><span>🥚</span>Trứng nở</button>
      <button data-mode="cup"><span>🏆</span>Giải đấu</button>
    </div>
    <h1 id="headline"></h1>
    <p class="lede" id="lede"></p>
    <div class="field-wrap">
      <div class="list-head"><label for="names"><b id="listLabel">Danh sách</b> <span id="count"></span></label>
        <button class="mini-btn" id="shuffleBtn" type="button">🔀 Xáo thứ tự</button></div>
      <textarea id="names" spellcheck="false" placeholder="Mỗi dòng một tên"></textarea>
      <p class="hint" id="listHint"></p>
      <p class="error" id="listWarn" aria-live="polite" hidden></p>
    </div>

    <div id="durWrap" class="stack" style="gap:8px">
      <p class="sub" id="durLabel">Độ dài đường đua</p>
      <div class="seg three" role="group" aria-labelledby="durLabel">
        <button data-dur="15">Ngắn ~15s</button>
        <button data-dur="30">Vừa ~30s</button>
        <button data-dur="50">Dài ~50s</button>
      </div>
      <p class="hint" id="survHint" hidden></p>
    </div>

    <div id="teamOpts" class="stack" style="gap:8px">
      <p class="sub">Số đội</p>
      <div class="seg three" role="group" aria-label="Số đội">
        <button data-k="2">2 đội</button>
        <button data-k="3">3 đội</button>
        <button data-k="4">4 đội</button>
      </div>
      <p class="sub">Tốc độ tìm chuồng</p>
      <div class="seg three" role="group" aria-label="Tốc độ tìm chuồng">
        <button data-spd="fast">Nhanh</button>
        <button data-spd="mid">Vừa</button>
        <button data-spd="slow">Lề mề 🐢</button>
      </div>
      <div class="box">
        <p class="sub">🔗 Dính nhau <span class="muted">luôn vào chung đội</span></p>
        <div class="pair"><select id="s1" aria-label="Con thứ nhất"></select><select id="s2" aria-label="Con thứ hai"></select><button class="add" id="addStick">Thêm</button></div>
        <div class="chips" id="chipsStick"></div>
        <div class="divider"></div>
        <p class="sub">🚫 Không chung chuồng</p>
        <div class="pair"><select id="a1" aria-label="Con thứ nhất"></select><select id="a2" aria-label="Con thứ hai"></select><button class="add" id="addApart">Thêm</button></div>
        <div class="chips" id="chipsApart"></div>
        <p class="error" id="pairErr" aria-live="polite"></p>
      </div>
    </div>

    <div id="payOpts" class="stack" style="gap:6px">
      <label class="field-wrap" for="prize" style="gap:6px"><b style="font-size:15px">Tên giải</b>
        <input id="prize" class="text-in" type="text" maxlength="40" placeholder="Battle Pass" autocomplete="off"></label>
      <label class="toggle"><input type="checkbox" id="avoidLast"> Né người vừa thắng lần trước</label>
      <p class="hint" id="lastPayInfo"></p>
    </div>

    <div id="cupOpts" class="stack" style="gap:8px">
      <p class="sub">Thể thức</p>
      <div class="seg three" role="group" aria-label="Thể thức">
        <button data-cupfmt="double">Nhánh thắng/thua</button>
        <button data-cupfmt="single">Loại trực tiếp</button>
        <button data-cupfmt="rr">Vòng tròn</button>
      </div>
      <p class="hint" id="cupHint"></p>
      <p class="sub">Đội lấy từ danh sách</p>
      <div class="seg three" role="group" aria-label="Cách tạo đội">
        <button data-cupbuild="solo">Mỗi người 1 đội</button>
        <button data-cupbuild="random">Ghép ngẫu nhiên</button>
        <button data-cupbuild="preset">Đội có sẵn</button>
      </div>
      <div id="cupSizeWrap" class="stack" style="gap:8px">
        <p class="sub">Mỗi đội mấy người</p>
        <div class="seg four" role="group" aria-label="Số người mỗi đội">
          <button data-cupsize="2">2 người</button><button data-cupsize="3">3 người</button><button data-cupsize="4">4 người</button><button data-cupsize="5">5 người</button>
        </div>
      </div>
      <label class="field-wrap" for="cupName" style="gap:6px"><b style="font-size:15px">Tên giải</b>
        <input id="cupName" class="text-in" type="text" maxlength="50" placeholder="Giải Lunar Capital" autocomplete="off"></label>
      <label class="toggle"><input type="checkbox" id="cupShuffle"> 🔀 Bốc thăm ngẫu nhiên vị trí các đội</label>
      <button class="ghost" id="cupResume" hidden></button>
    </div>

    <div class="stack" style="gap:8px" id="herdWrap">
      <p class="sub" id="herdLabel">Đàn thú</p>
      <div class="seg herd" role="group" aria-labelledby="herdLabel">
        <button data-herd="goose" aria-label="Ngỗng">🪿</button>
        <button data-herd="bunny" aria-label="Thỏ">🐰</button>
        <button data-herd="squirrel" aria-label="Sóc">🐿️</button>
        <button data-herd="penguin" aria-label="Cánh cụt">🐧</button>
        <button data-herd="mix" aria-label="Trộn ngẫu nhiên">🔀 Trộn</button>
      </div>
    </div>
    <label class="toggle" id="colorWrap"><input type="checkbox" id="colorful"> 🎨 Mỗi con một màu</label>
    <label class="toggle" id="numWrap"><input type="checkbox" id="showNum"> <span id="numLabel">Hiện số trên ngỗng</span></label>
    <p class="error" id="err" aria-live="polite"></p>
    <button class="cta" id="go">Xuất phát</button>
  </section>

  };
  function line(r,kind){
    const set=LINES[kind]||LINES.chat, sp=r.sp||"goose";
    const pool=(set[sp]||[]).concat(set.all||[]);
    let t=pick(pool), tries=0;
    while(t===r.lastLine&&pool.length>1&&tries++<4) t=pick(pool);

  /* Tô màu: mỗi màu tạo một bản sheet riêng, chỉ đổi phần lông/thân, giữ viền, mỏ, chân */
  const sheetImg=new Image(); let sheetReady=false; sheetImg.onload=()=>{sheetReady=true;}; sheetImg.src=SHEET;
  const tintCache=new Map();
  const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const mixC=(c,t,k)=>c.map((v,i)=>Math.round(v+(t[i]-v)*k));
  // hàng trong sheet (bước 36px): 0-3 ngỗng, 4-5 thỏ, 6-7 sóc, 8-11 cánh cụt
  const rowSpecies=y=>{const r=Math.floor(y/36);return r<4?"goose":r<6?"bunny":r<8?"squirrel":"penguin";};
  const TINT_RULES={ // màu gốc -> cách pha với màu của người chơi
    goose:{"235,240,239":c=>mixC(c,[255,255,255],.3)},
    bunny:{"179,181,180":c=>mixC(c,[255,255,255],.12),"235,240,239":c=>mixC(c,[255,255,255],.6)},
    squirrel:{"164,54,65":c=>mixC(c,[0,0,0],.08)},
    penguin:{"85,85,85":c=>mixC(c,[0,0,0],.3)}
  };
  function tintedSheet(hex){
    if(tintCache.has(hex)) return tintCache.get(hex);
    if(!sheetReady) return null;
    const cv=document.createElement("canvas"); cv.width=sheetImg.width; cv.height=sheetImg.height;
    const g=cv.getContext("2d"); g.drawImage(sheetImg,0,0);
    const d=g.getImageData(0,0,cv.width,cv.height), px=d.data, col=hexRgb(hex);
    for(let y=0;y<cv.height;y++){
      const rules=TINT_RULES[rowSpecies(y)];
      for(let x=0;x<cv.width;x++){
        const i=(y*cv.width+x)*4; if(!px[i+3]) continue;
        const f=rules[px[i]+","+px[i+1]+","+px[i+2]]; if(!f) continue;
        const [r,gg,b]=f(col); px[i]=r; px[i+1]=gg; px[i+2]=b;
      }
    }
    g.putImageData(d,0,0);
    const url=blobUrl(cv.toDataURL("image/png")); tintCache.set(hex,url); return url;
  }
  const sprites=new Set();
  function makeSprite(getAnim,species,tint){
    const el=document.createElement("div"); el.className="spr";
    const s=SP_INFO[species]?species:"goose";
    if(SP_INFO[s].scale!==1) el.style.scale=String(SP_INFO[s].scale);
    const sp={el,getAnim,sp:s,phase:rnd()*10,added:false,tint:tint||null,tinted:!tint};
    sprites.add(sp); return sp;
  }
  // Đọc kích thước của mọi con trước rồi mới ghi style: đọc xen kẽ với ghi bắt trình duyệt tính lại bố cục
  // cả trang cho từng con, rất chậm khi đông (nhất là đường đua dài). Kích thước chỉ đo lại mỗi ~1 giây.
  let paintN=0;
  function paint(t){
    const remeasure=(paintN++%60)===0;
    for(const sp of sprites) if(!sp.vl&&sp.el.isConnected&&(remeasure||sp.h===undefined)) sp.h=sp.el.clientHeight;
    for(const sp of sprites){
      if(!sp.el.isConnected){ if(sp.added) sprites.delete(sp); continue; }
      if(sp.vl){ // nhân vật kiếm hiệp: đứng/chạy lặp lại, các động tác khác chạy một lần rồi giữ khung cuối
        sp.added=true;
        const st=sp.getAnim(), c=sp.c, an=c.anims[st.a]||c.anims.idle, fps=VL_FPS[st.a]||8;
        const f=(st.a==="idle"||st.a==="run")?Math.floor((t/1000+sp.phase)*fps)%an.n:Math.min(an.n-1,Math.floor(Math.max(0,t-st.t0)/1000*fps));
        const key=an.row*100+f;
        if(key!==sp.f){sp.f=key; sp.el.style.backgroundPosition=`${(-f*c.cw*sp.s).toFixed(1)}px ${(-(c.y+an.row*c.ch)*sp.s).toFixed(1)}px`;}
        continue;
      }
      const h=sp.h; if(!h) continue;
      sp.added=true;
      if(!sp.tinted){const u=tintedSheet(sp.tint); if(u){sp.el.style.backgroundImage=`url(${u})`;sp.tinted=true;}}
      const set=ANIMS[sp.sp], k=h/32, a=set[sp.getAnim()]||set.idle;
      const f=Math.floor((t/1000+sp.phase)*a.fps)%a.n;
      // mỗi ô 40x32 có viền trống 2px quanh, để khi phóng to không bị ăn lem sang ô bên cạnh; chỉ ghi khi có thay đổi
      if(h!==sp.lastH){sp.lastH=h; sp.el.style.backgroundSize=`${264*k}px ${432*k}px`; sp.f=-1;}
      const key=a.row*100+f;
      if(key!==sp.f){sp.f=key; sp.el.style.backgroundPosition=`${-(f*44+2)*k}px ${-(a.row*36+2)*k}px`;}
    }
    requestAnimationFrame(paint);
  }
  requestAnimationFrame(paint);

  // Nhân vật kiếm hiệp cao bodyPx (tính theo người lúc đứng), neo ở chân: đặt trong một khung có chân ở giữa đáy

    sprites.add({el,getAnim,vl:true,c,s,phase:rnd()*10,f:-1,added:false});
    return el;
  }

  // bong bóng sát mép phải thì lật sang trái cho khỏi bị cắt chữ; xét lại mỗi khung hình vì con thú vẫn chạy
  function sideBubble(r){
    const b=r.bubble, box=b.closest(".track-wrap,.pasture,.ring,.nest"); if(!box) return;
    const gr=r.el.getBoundingClientRect(), right=gr.left+gr.width*.88+b.offsetWidth, edge=box.getBoundingClientRect().right-4;

  }

  function audio(){actx=actx||new (window.AudioContext||window.webkitAudioContext)();return actx;}
  function honk(pitch=1,delay=0,vol=.35){
    if(muted) return;
    try{
      const ac=audio(), t=ac.currentTime+delay;
      const o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
      o.type="sawtooth"; o.frequency.setValueAtTime(460*pitch,t); o.frequency.exponentialRampToValueAtTime(300*pitch,t+.2);
      f.type="bandpass"; f.frequency.value=900; f.Q.value=1.2;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.24);
      o.connect(f); f.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.26);
    }catch(e){}
  }
  function blip(){
    if(muted) return;
    try{
      const ac=audio(), t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
      o.type="square"; o.frequency.value=1100; g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.001,t+.04);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.05);
    }catch(e){}
  }

  function countdown(host,my,done){

  const MODE_INFO={
    give:{h:()=>`Con ${noun()} nào về nhất, người đó thắng.`,lede:()=>`Mỗi người một con ${noun()}, chạy hoàn toàn ngẫu nhiên trên đường đua dài. Camera bám theo con dẫn đầu cho tới vạch đích.`,go:()=>"Xuất phát",max:40,dur:"Độ dài đường đua"},

    survive:{h:()=>"Phát vũ khí, chém nhau tới người cuối cùng.",lede:()=>"Mỗi người một chiến binh pixel với một món vũ khí ngẫu nhiên, mỗi món có sát thương tối thiểu–tối đa riêng. Cả sân lao vào chém nhau, hết máu là văng khỏi sân. Cuối trận bo thu hẹp, ở ngoài bo bị mất máu. Ai trụ lại cuối cùng là người thắng.",go:()=>"Vào đấu trường",max:40,dur:"Thời lượng trận"},

    pass:{h:()=>`Con ${noun()} dừng trước ai, người đó ẵm ${prizeName()}.`,lede:()=>`Cả nhóm xếp vòng quanh ${prizeName()}. Nhấn giữ lệnh bài lấy đà rồi thả, con ${noun()} chạy vòng vòng, chậm dần rồi dừng trước một người. Người đó mang giải về.`,go:()=>`Tranh ${prizeName()}`,max:40},

  let mode=store.get("dua-ngong-mode","give"); if(mode==="pay") mode="pass"; if(!MODE_INFO[mode]) mode="give";

  /* Chia K đội ngẫu nhiên thoả ràng buộc: nhóm "dính" gộp bằng union-find, rồi tìm kiếm
     quay lui có trọng số theo chỗ trống còn lại (không ràng buộc thì mọi cách chia đều như nhau). */
  function solveTeams(racers,K){
    const n=racers.length, idx=new Map();
    racers.forEach((r,i)=>{if(!idx.has(r.name))idx.set(r.name,i);});
    const ok=pr=>idx.has(pr[0])&&idx.has(pr[1]);
    const stick=pairs.stick.filter(ok).map(pr=>[idx.get(pr[0]),idx.get(pr[1])]);
    const apart=pairs.apart.filter(ok).map(pr=>[idx.get(pr[0]),idx.get(pr[1])]);
    const par=[...Array(n).keys()];
    const find=x=>{while(par[x]!==x){par[x]=par[par[x]];x=par[x];}return x;};
    stick.forEach(([a,b])=>{par[find(a)]=find(b);});
    const gmap=new Map();
    for(let i=0;i<n;i++){const r=find(i);if(!gmap.has(r))gmap.set(r,[]);gmap.get(r).push(i);}
    const groups=[...gmap.values()], gid=new Array(n);
    groups.forEach((g,k)=>g.forEach(i=>gid[i]=k));
    const adj=groups.map(()=>new Set());
    for(const [a,b] of apart){
      if(gid[a]===gid[b]) return {error:`${racers[a].name} và ${racers[b].name} vừa bị dính (qua các cặp dính) vừa không được chung chuồng.`};
      adj[gid[a]].add(gid[b]); adj[gid[b]].add(gid[a]);
    }
    const base=Math.floor(n/K), extra=n%K, maxSize=extra?base+1:base;
    const big=groups.find(g=>g.length>maxSize);
    if(big) return {error:`Nhóm dính (${big.map(i=>racers[i].name).join(", ")}) có ${big.length} con, đông hơn sĩ số tối đa một đội (${maxSize}).`};
    const order=shuffle(groups.map((g,i)=>i)).sort((a,b)=>groups[b].length-groups[a].length);
    const size=new Array(K).fill(0), assign=new Array(groups.length);
    let over=0, steps=0;
    function dfs(i){
      if(++steps>300000) return false;
      if(i===order.length) return true;
      const g=order[i], len=groups[g].length;
      let cands=[];
      for(let t=0;t<K;t++){
        if(size[t]+len>maxSize) continue;
        const willOver=size[t]<=base&&size[t]+len>base;
        if(willOver&&over>=extra) continue;
        let clash=false; for(const h of adj[g]) if(assign[h]===t){clash=true;break;}
        if(!clash) cands.push(t);
      }
      const ordered=[];
      while(cands.length){
        const w=cands.map(t=>maxSize-size[t]+.01), tot=w.reduce((a,b)=>a+b,0);
        let x=rnd()*tot, k=0; while(k<cands.length-1&&x>=w[k]){x-=w[k];k++;}
        ordered.push(cands.splice(k,1)[0]);
      }
      for(const t of ordered){
        const willOver=size[t]<=base&&size[t]+len>base;
        assign[g]=t; size[t]+=len; if(willOver) over++;
        if(dfs(i+1)) return true;
        assign[g]=undefined; size[t]-=len; if(willOver) over--;
      }
      return false;
    }
    if(!dfs(0)) return {error:steps>300000?"Ràng buộc phức tạp quá, thử bớt vài cặp.":`Không tìm được cách chia ${K} đội đều nhau thoả hết ràng buộc. Thử bớt vài cặp.`};
    const team=new Array(n);
    groups.forEach((g,k)=>g.forEach(i=>team[i]=assign[k]));
    return {team,groups,apart,caps:size.slice(),K};
  }

  let G=null;
  function startGive(racers){
    const my=++session; show(scr.race);
    const wrap=$("trackWrap"), world=$("world"), mini=$("mini");
    world.innerHTML=""; mini.querySelectorAll("i").forEach(x=>x.remove());
    const n=racers.length, W=wrap.clientWidth;
    const lh=n<=8?52:n<=15?42:n<=25?32:26, gh=lh-2, gw=gh*1.25;
    const START=Math.min(140,Math.round(W*.36)), TRACK=Math.round(W*(dur/15)*3.2), END=START+TRACK, worldW=END+W;
    // chừa khoảng trên cho con to (thỏ, cánh cụt) khỏi bị cắt đầu, và cộng thêm viền 3px mỗi cạnh

    racers.forEach((r,i)=>{const d=document.createElement("div");d.className="lane "+(i%2?"b":"a");d.style.top=(padT+i*lh)+"px";d.style.height=lh+"px";world.appendChild(d);});

    const steps=Math.max(3,Math.round(dur/5));

    const fin=document.createElement("div"); fin.className="finish"; fin.style.left=END+"px"; world.appendChild(fin);
    const decos=["🌼","🌿","🌸","🍀"];
    for(let k=0;k<Math.round(worldW/45);k++){const d=document.createElement("span");d.className="deco";d.textContent=decos[k%4];d.style.left=between(0,worldW)+"px";d.style.top=between(0,H-14)+"px";world.appendChild(d);}
    G={my,racers,W,wrap,START,TRACK,worldW,gw,cam:0,running:false,winner:null,finishedAt:0,finished:[],leaderName:"",t:0};
    racers.forEach((r,i)=>{

      const g=makeGoose(r,()=>(!G.running||r.done||r.state==="stall")?"idle":r.state==="sprint"?"flap":"run");
      g.style.width=gw+"px"; g.style.height=gh+"px"; g.style.top=(padT+i*lh+1)+"px";

  }
  function tickGive(dt){
    G.t+=dt;
    const avg=G.racers.reduce((s,r)=>s+r.p,0)/G.racers.length;
    for(const r of G.racers){
      if(r.done) continue;
      r.retarget-=dt; r.stateT-=dt; tickBubble(r,dt);
      if(r.retarget<=0){r.target=between(.6,1.45);r.retarget=between(.3,.8);}
      if(r.state!=="run"&&r.stateT<=0) r.state="run";
      if(r.state==="run"){
        const roll=rnd();
        if(roll<.09*dt){r.state="stall";r.stateT=between(.5,1.1);say(r,line(r,"stall"));}
        else if(roll<.20*dt){r.state="sprint";r.stateT=between(.6,1.2);say(r,line(r,"sprint"));}
        else if(roll<.29*dt){say(r,line(r,"chat"));}
      }
      r.mult+=(r.target-r.mult)*Math.min(1,dt*3);
      let m=r.mult*(r.state==="stall"?.1:r.state==="sprint"?1.9:1);
      m*=clamp(1+(avg-r.p)*2.4,.82,1.3); // con tụt lại được đẩy nhẹ cho kịch tính
      r.p+=r.base*m*dt;
      if(r.p>=1){
        r.p=1; r.done=true; G.finished.push(r);
        if(!G.winner){G.winner=r;G.finishedAt=G.t;say(r,line(r,"win"),2.5);honk(1.25);honk(1.25,.28);$("status").textContent=`🏆 ${r.name} về nhất!`;}

  /* ---------- Mode: Chia team ---------- */
  // cap = thời gian tối đa (giây, không tính đếm ngược) để cả đàn vào chuồng
  const SPD={fast:{v:1,fake:.14,stall:.07,noise:4,cap:15},mid:{v:.62,fake:.26,stall:.11,noise:5,cap:30},slow:{v:.36,fake:.42,stall:.17,noise:6.5,cap:60}};
  const NS="http://www.w3.org/2000/svg";
  let T=null;
  function startTeam(racers,sol){
    const my=++session; show(scr.team);
    const past=$("pasture"); past.innerHTML="";
    const box=$("teamsBox"); box.innerHTML=""; box.className="teams"+(sol.K===3?" three":"");
    $("teamActions").hidden=true;
    const n=racers.length, K=sol.K, W=past.clientWidth, S=SPD[spd]||SPD.mid;
    const H=Math.round(clamp(window.innerHeight-230,K===4?470:400,620));
    past.style.height=H+"px";
    const gh=gooseSize(n), gw=gh*1.25, gateH=76, topEntry=10+gateH, botEntry=H-10-gateH;
    const layout=K===2?[[.26,0],[.74,0]]:K===3?[[.17,0],[.5,0],[.83,0]]:[[.26,0],[.74,0],[.26,1],[.74,1]];
    const gateW=Math.round(W*(K===3?.3:.4));
    const gates=layout.map(([fx,bottom],t)=>{
      const info=TEAMS[t], g={x:W*fx,cap:sol.caps[t],members:[],dir:bottom?-1:1,entryY:bottom?botEntry:topEntry,gapHalf:gateW*.16,...info};
      const d=document.createElement("div"); d.className="gate"+(bottom?" bottom":"")+(K===3?" narrow":"");
      d.style.left=(g.x-gateW/2)+"px"; d.style.width=gateW+"px";
      d.innerHTML=`<div class="gl"><b><span class="flag" style="background:${info.color}"></span>${info.name}</b><span class="ct">0/${g.cap}</span></div>`;
      past.appendChild(d); g.label=d.querySelector(".ct");
      const card=document.createElement("div"); card.className="team"; card.style.setProperty("--c",info.color);
      card.innerHTML=`<h3>${info.name} <small>0/${g.cap}</small></h3><ol></ol>`;
      box.appendChild(card); g.cnt=card.querySelector("small"); g.list=card.querySelector("ol");
      return g;
    });
    const svg=document.createElementNS(NS,"svg"); svg.setAttribute("class","ropes"); past.appendChild(svg);

    const groups=shuffle(sol.groups).map(g=>shuffle(g));
    T={my,racers,gates,W,H,gw,gh,running:false,left:n,S,ropes:[],elapsed:0,hurry:false,forced:false,
       yMin:topEntry+2,yMax:K===4?botEntry-2:H-12,
       apartSet:new Set(sol.apart.map(([a,b])=>a<b?a+"-"+b:b+"-"+a))};
    racers.forEach((r,i)=>r.idx=i);
    groups.forEach((g,gi)=>g.forEach((ri,k)=>{
      const r=racers[ri]; r.gid=gi; r.isLeader=k===0; r.prev=k?racers[g[k-1]]:null;
      r.members=k===0?g.map(j=>racers[j]):null; r.leader=racers[g[0]];
    }));
    const order=groups.flat();
    const cols=Math.max(1,Math.floor((W-20)/(gw+18))), rows=Math.ceil(n/cols), rowH=gh+22;
    const firstY=K===4?H/2+(rows-1)*rowH/2+gh/2:H-14;
    order.forEach((ri,k)=>{
      const r=racers[ri];
      const row=Math.floor(k/cols), col=k%cols, usedCols=Math.min(cols,n-row*cols), spanW=(W-20)/cols;
      const x0=(W-usedCols*spanW)/2+spanW*(col+.5)+between(-6,6);
      const y0=clamp(firstY-row*rowH+between(-4,4),T.yMin+gh+30,T.yMax);
      const dest=sol.team[ri];
      Object.assign(r,{x:x0,y:y0,h:(K===4?(rnd()<.5?-1:1):-1)*Math.PI/2+between(-.3,.3),dest,target:dest,fakeT:0,
        offX:between(-1,1),base:between(.9,1.1)*H/8.5*S.v,mult:1,tgt:1,retarget:0,state:"run",stateT:0,bubbleT:0,
        switchT:between(.6,2),sayCool:0,in:false,stuckT:0});
      if(r.isLeader&&rnd()<S.fake){r.target=pickOther(r);r.fakeT=between(1,2.4);}
      const g=makeGoose(r,()=>(!T.running||r.in||r.state==="stall")?"idle":r.state==="sprint"?"flap":"run");
      g.style.width=gw+"px"; g.style.height=gh+"px";
      past.appendChild(g); placeTeam(r);
    });
    groups.forEach(g=>{for(let k=1;k<g.length;k++){
      const line=document.createElementNS(NS,"line");
      line.setAttribute("stroke","#FF6FAE"); line.setAttribute("stroke-width","3"); line.setAttribute("stroke-linecap","round"); line.setAttribute("stroke-dasharray","6 4");
      svg.appendChild(line); T.ropes.push({a:racers[g[k-1]],b:racers[g[k]],line});

    countdown(past,my,()=>{T.running=true;$("status2").textContent="Chạy về chuồng nào!";shuffle(racers).slice(0,Math.min(3,racers.length)).forEach(r=>say(r,line(r,"start")));loop(my,tickTeam);});
  }
  function pickOther(r){
    const opts=T.gates.map((g,i)=>i).filter(i=>i!==r.dest&&T.gates[i].members.length<T.gates[i].cap);
    return opts.length?pick(opts):r.dest;
  }
  function placeTeam(r){

  function updateRopes(){

      if(hide) continue;

      rp.line.setAttribute("x2",rp.b.x); rp.line.setAttribute("y2",rp.b.y-T.gh*.45);
    }
  }
  const nearGate=(r,G)=>Math.abs(r.x-G.x)<G.gapHalf&&(G.dir>0?r.y<=G.entryY+10:r.y>=G.entryY-10);
  function tickTeam(dt){
    const S=T.S, active=T.racers.filter(r=>!r.in);
    T.elapsed+=dt;
    const u=clamp((T.elapsed-S.cap*.45)/(S.cap*.4),0,1); // càng gần hạn chót càng bớt lưỡng lự
    if(!T.hurry&&T.elapsed>S.cap*.85){
      T.hurry=true; $("status2").textContent="⏰ Hết giờ suy nghĩ, về chuồng mau!";
      for(const r of active) if(r.isLeader){ if(r.target!==r.dest){r.target=r.dest;say(r,line(r,"hurry"));} r.state="run"; }
    }
    if(!T.forced&&T.elapsed>S.cap){

    for(const r of active){
      if(r.in) continue;
      tickBubble(r,dt); r.sayCool-=dt;

        const P=r.prev, gap=T.gw*.95;
        const tx=P.x-Math.cos(P.h)*gap, ty=P.y-Math.sin(P.h)*gap;
        const ox=r.x, oy=r.y, k=Math.min(1,dt*5);

      }
      r.retarget-=dt; r.stateT-=dt; r.switchT-=dt;

        const roll=rnd(), st=S.stall*(1-u);

        else if(roll<(st+.08)*dt){r.state="sprint";r.stateT=between(.5,1);say(r,line(r,"sprint"));}
        else if(roll<(st+.16)*dt){say(r,line(r,"chat"));}
      }
      if(r.target!==r.dest){

      }

      const tx=G.x+r.offX*G.gapHalf*.5;
      const ty=Math.abs(r.x-G.x)<G.gapHalf*1.4?G.entryY-G.dir*6:G.entryY+G.dir*45; // vòng tới trước cửa chuồng rồi mới vào
      r.px=r.x; r.py=r.y;

      r.mult+=(r.tgt-r.mult)*Math.min(1,dt*3);
      const v=r.base*r.mult*(r.state==="stall"?.08:r.state==="sprint"?1.8:1)*(1+u*1.2)*(T.hurry?2.5:1);
      r.x+=Math.cos(r.h)*v*dt; r.y+=Math.sin(r.h)*v*dt;

    for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++){

      const enemy=T.apartSet.has(a.idx<b.idx?a.idx+"-"+b.idx:b.idx+"-"+a.idx);

        A.x-=ux*push+uy*side; A.y-=uy*push-ux*side; B.x+=ux*push+uy*side; B.y+=uy*push-ux*side;

      }

      r.x=clamp(r.x,T.gw/2,T.W-T.gw/2); r.y=clamp(r.y,T.yMin,T.yMax);

          r.stuckT=(Math.hypot(r.x-r.px,r.y-r.py)<r.want*.3)?r.stuckT+dt:0;
          if(r.stuckT>1.2){r.h+=(rnd()<.5?-1:1)*between(1.2,2);r.stuckT=0;}

        if(r.target!==r.dest&&nearGate(r,Gt)){r.target=r.dest;r.fakeT=0;say(r,line(r,Gt.members.length>=Gt.cap?"fullPen":"wrongPen"));}
      }

    }

    if(T.left===0){T.running=false;const my=T.my;setTimeout(()=>{if(my===session&&T.left===0)teamDone();},700);return false;}
  }
  function enterGroup(L,G){

  function teamDone(){

  /* ---------- Mode: Sinh tồn ---------- */
  // Mỗi con 100 máu, phát ngẫu nhiên một vũ khí (sát thương min–max, thời gian hồi đòn, tầm đánh).
  // Các món được cân để sát thương mỗi giây gần bằng nhau; đánh xa thấp hơn chút vì đứng xa an toàn hơn.
  // Vị trí, vũ khí, mục tiêu, thứ tự xử lý mỗi khung hình đều xáo ngẫu nhiên nên trước trận ai cũng như nhau.
  // Cuối trận bo thu hẹp, ở ngoài bo bị trừ máu, để trận xong gần đúng thời lượng đã chọn.
  let A=null;
  function startSurvive(racers){

    $("outList").innerHTML=""; $("outTitle").hidden=true;

    const gh=Math.round(clamp(gooseSize(n)*1.5,44,72)), hw=Math.round(gh*.5), gw=gh*.8;

    // sát thương giữ đúng min–max của vũ khí; lượng máu chỉnh theo số con và thời lượng để trận dài ngắn đúng lựa chọn
    const hpMax=Math.round(clamp(100*(.85*dur)/Math.min(4+1.5*n,17),40,400));

    A={my,racers,W,H,gw,gh,hw,hpMax,alive:n,t:0,order:[],running:false,done:false,hearts:[],heartT:between(3,5),
       zone,zx:W/2,zy:H/2,zR0:Math.hypot(W,H)/2+gw,zR:Math.hypot(W,H)/2+gw,zMin:gw*1.6,feedT:0,blipT:0};
    const cols=Math.ceil(Math.sqrt(n*W/H)), rows=Math.ceil(n/cols);

    shuffle(racers).forEach((r,q)=>{ // q: thứ tự đặt chỗ

      Object.assign(r,{x:clamp(cx,gw/2,W-gw/2),y:clamp(cy,gh+4,H-10),h:between(-Math.PI,Math.PI),
        base:between(.95,1.05)*gw*1.7,state:"run",bubbleT:0,out:false,hp:hpMax,wpn:wpns[q],cool:between(.3,1.2),
        tgt:null,retT:0,kills:0,hurtT:0,atkT:0,pend:null,anim:{a:"idle",t0:0},jx:between(-1,1),jy:between(-1,1)});
      r.sp="hero"; // thoại chung, không dùng câu riêng của thú
      const root=document.createElement("div"); root.className="goose warrior";
      root.innerHTML=`<span class="foot"></span><span class="bubble"></span><span class="gname"></span>`;
      root.querySelector(".foot").style.background=r.color; root.querySelector(".gname").textContent=r.name;
      const fs=fighterSprite(r.wpn.id,gh,()=>r.anim);
      root.appendChild(fs); root.style.width=hw+"px"; root.style.height=gh+"px";
      r.el=root; r.spr=fs; r.bubble=root.querySelector(".bubble");
      const hp=document.createElement("span"); hp.className="hpb"; hp.innerHTML="<i></i>"; root.appendChild(hp); r.hpEl=hp.firstChild;
      host.appendChild(r.el); placeArena(r);

  }
  function placeArena(r){

  // động tác: đứng/chạy đổi khi khác; chiêu, trúng đòn, ngã thì chạy lại từ đầu
  const animLen=(r,a)=>{const c=VL.chars.find(x=>x.id===r.wpn.id); return c.anims[a].n/VL_FPS[a];};
  function play(r,a){ if(r.anim.a!==a) r.anim={a,t0:performance.now()}; }

  function floatText(x,y,text,cls){

  function setHp(r){

  function hurt(v,dmg,by,crit){

  function strike(a,v){ // đòn đánh trúng (đạn bay tới cũng gọi hàm này)
    if(v.out||A.done) return;
    if(rnd()<DODGE){floatText(v.x,v.y-A.gh*1.05,"Né!","miss"); return;}
    const w=a.wpn, crit=rnd()<CRIT;
    const dmg=(w.min+Math.floor(rnd()*(w.max-w.min+1)))*(crit?2:1);
    // đẩy lùi nhẹ theo hướng đòn
    const d=Math.hypot(v.x-a.x,v.y-a.y)||1; v.x+=(v.x-a.x)/d*A.gw*(crit?.35:.15); v.y+=(v.y-a.y)/d*A.gw*(crit?.35:.15);
    if(crit&&rnd()<.5) say(a,["Chí mạng!","Ăn nè!","Cú này đau!","Bùm!"][Math.floor(rnd()*4)],1);

  function pickTarget(r,alive){
    // con gần nhất, thỉnh thoảng đổi ý chọn con khác cho đỡ đoán trước
    const others=alive.filter(o=>o!==r); if(!others.length) return null;
    if(rnd()<.25) return pick(others);
    let best=null,bd=1e9; for(const o of others){const d=Math.hypot(o.x-r.x,o.y-r.y); if(d<bd){bd=d;best=o;}}
    return best;

  function tickSurvive(dt){
    A.t+=dt; A.blipT-=dt; A.feedT-=dt;
    // bo: thu từ 40% thời lượng, còn nhỏ ở 85%, hết giờ thì thu về 0 (ai cũng ở ngoài, máu tụt nhanh)
    const zp=clamp((A.t-dur*.4)/(dur*.45),0,1), zEnd=clamp((A.t-dur*.85)/(dur*.15),0,1), late=A.t>dur?2:1;
    A.zR=(A.zR0+(A.zMin-A.zR0)*zp)*(1-zEnd); placeZone();
    const alive=shuffle(A.racers.filter(r=>!r.out)); // thứ tự xử lý ngẫu nhiên mỗi khung hình
    if(A.feedT<=0&&!A.done) $("status3").textContent=zp>0&&zp<1?`Còn ${A.alive} người · ⚠️ Bo đang thu hẹp`:`Còn ${A.alive} người`;
    // máu rơi
    A.heartT-=dt;

      A.heartT=between(3,6);
      const ang=rnd()*Math.PI*2, rr=Math.min(A.zR*.7,Math.min(A.W,A.H)*.4)*Math.sqrt(rnd());
      const hx=clamp(A.zx+Math.cos(ang)*rr,A.gw/2,A.W-A.gw/2), hy=clamp(A.zy+Math.sin(ang)*rr,A.gh+4,A.H-10);
      const el=document.createElement("span"); el.className="heart"; el.textContent="❤️"; el.style.left=hx+"px"; el.style.top=hy+"px"; $("arena").appendChild(el);
      A.hearts.push({x:hx,y:hy,el});
    }
    for(const r of alive){
      if(r.out) continue;
      tickBubble(r,dt); r.cool-=dt; r.retT-=dt;
      if(r.flashT>0){r.flashT-=dt; if(r.flashT<=0) r.el.classList.remove("hurt");}
      if(r.hurtT>0) r.hurtT-=dt;
      if(r.pend){ // đòn ra đúng lúc vung tay: trúng nếu đối thủ còn trong tầm (nới rộng chút vì đối thủ có thể lùi)
        r.pend.t-=dt;
        if(r.pend.t<=0){
          const v=r.pend.v; r.pend=null;

      }
      if(!r.tgt||r.tgt.out||r.retT<=0){r.tgt=pickTarget(r,alive);r.retT=between(1.5,3);}
      const w=r.wpn, range=A.gw*1.05;
      let gx=r.x, gy=r.y, want=0;
      // ngoài bo thì chạy vào trong trước

      // máu thấp thì đi nhặt tim nếu gần
      const heart=r.hp<A.hpMax*.45&&A.hearts.find(h=>Math.hypot(h.x-r.x,h.y-r.y)<A.gw*5);
      if(outside){gx=A.zx;gy=A.zy;want=1.25;}
      else if(heart){gx=heart.x;gy=heart.y;want=1.1;}
      else if(r.tgt){
        const t=r.tgt, d=Math.hypot(t.x-r.x,t.y-r.y);
        if(d>range*.9){gx=t.x+r.jx*A.gw*.3;gy=t.y+r.jy*A.gw*.3;want=1;}
        if(d<=range&&r.cool<=0&&!r.pend){
          // ra chiêu: chọn ngẫu nhiên 1 trong 2 chiêu, đòn trúng ở giữa động tác
          const a=rnd()<.5?"a1":"a2", len=animLen(r,a);
          r.cool=w.cd*between(.9,1.1); r.state="atk"; r.atkT=len; r.hurtT=0; playOnce(r,a);
          r.h=Math.atan2(t.y-r.y,t.x-r.x);

      if(want>0){
        const ang=Math.atan2(gy-r.y,gx-r.x); r.h+=angDiff(r.h,ang)*Math.min(1,dt*8);
        const v=r.base*want*(r.state==="atk"?.25:r.hurtT>0?.5:1);
        r.x+=Math.cos(r.h)*v*dt; r.y+=Math.sin(r.h)*v*dt;

      } else if(r.state!=="atk") r.state="idle";

    }
    // ngoài bo bị trừ máu (càng về cuối càng đau)
    if(zp>0) for(const r of shuffle(A.racers.filter(x=>!x.out))){

    }
    // nhặt tim
    for(const r of A.racers){ if(r.out) continue;
      const hi=A.hearts.findIndex(h=>Math.hypot(h.x-r.x,h.y-r.y)<A.gw*.6);
      if(hi>=0){const h=A.hearts.splice(hi,1)[0]; h.el.remove(); const add=Math.min(Math.round(A.hpMax*.25),A.hpMax-r.hp); r.hp+=add; setHp(r); floatText(r.x,r.y-A.gh*1.05,"+"+Math.round(add),"heal");}
    }
    // tách nhau ra cho khỏi chồng lên
    const live=A.racers.filter(r=>!r.out), minD=A.gw*.6;
    for(let i=0;i<live.length;i++)for(let j=i+1;j<live.length;j++){
      const a=live[i],b=live[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01;

    }
    for(const r of live){ r.x=clamp(r.x,A.gw/2,A.W-A.gw/2); r.y=clamp(r.y,A.gh+4,A.H-10); placeArena(r); }

      $("status3").textContent=`🏆 ${w.name} trụ lại cuối cùng! ${w.wpn.name}, ${w.kills} hạ gục`;
      honk(1.25);honk(1.25,.28);
      setTimeout(()=>{
        if(A.my===session){
          const order=[w].concat(A.order.slice().reverse());
          showResult({label:`🏆 Sống sót cuối cùng · ${w.wpn.name} · ${w.kills} hạ gục`,name:w.name,hero:w.wpn.id,color:w.color,num:showNum?w.num:0,order,
            note:r=>`${r.wpn.name} · ${r.kills} hạ gục`,again:"Chơi lại",
            removeText:order.length>2?`Loại "${w.name}", chơi tiếp`:null,
            copy:`🏆 Sống sót: ${w.name} (${w.wpn.name}, ${w.kills} hạ gục)\n\nThứ tự:\n`+order.map((r,i)=>`${i+1}. ${r.name} · ${r.wpn.name} · ${r.kills} hạ gục`).join("\n")});
        }

      return false;
    }
  }
  function knock(v,by){

  function placeMom(){

  function eggSpot(r){ // vị trí ngỗng mẹ đứng cạnh quả trứng (toạ độ trong ổ)

  function tickEgg(dt){
    E.t+=dt;

    if(m.state==="sit"){

    const runner={name:"",color:"#333",num:"",sp:herd==="mix"?pick(SPECIES):herd};
    makeGoose(runner,()=>R.speed>5?"flap":R.speed>1.4?"run":R.speed>.15?"walk":"idle");
    runner.el.style.width=gw+"px"; runner.el.style.height=gh+"px";
    host.appendChild(runner.el);
    R={my,items,k,seg,track,P,gw,gh,goose:runner,seats,slices,cands,a:a0,a0,targetA:0,total:0,TT:1,t:0,speed:0,win:-1,cur:-1,done:false,
       tok,pw,holding:false,holdT:0,pressure:0,power:0,spun:false};
    placeRing(R.a,track);
    $("status5").textContent=`Nhấn giữ ${prizeName()} để lấy đà, thả tay là quay. Giữ càng lâu quay càng dữ.`;
    // Nhấn giữ lấy đà: giữ ~2 giây là đầy lực. Máy có cảm biến lực nhấn thì nhấn mạnh cũng tính.
    const press=e=>{ if(R.spun||R.holding) return; R.holding=true; R.holdT=0; R.pressure=0; if(e&&e.pointerId!=null) try{tok.setPointerCapture(e.pointerId);}catch(_){} say(runner,line(runner,"charge"),9); };
    const move=e=>{ if(R.holding&&e.pressure>0&&e.pressure!==.5) R.pressure=Math.max(R.pressure,e.pressure); };
    const release=()=>{ if(!R.holding||R.spun) return; R.holding=false; spinRing(); };
    tok.addEventListener("pointerdown",e=>{e.preventDefault();press(e);move(e);});
    tok.addEventListener("pointermove",move);
    tok.addEventListener("pointerup",release); tok.addEventListener("pointercancel",release);
    tok.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&!e.repeat){e.preventDefault();press();}});
    tok.addEventListener("keyup",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();release();}});
    tok.addEventListener("contextmenu",e=>e.preventDefault());
    loop(my,chargeTick);
  }
  function chargeTick(dt){
    if(R.spun) return false;
    if(R.holding) R.holdT+=dt;
    R.power=clamp(Math.max(R.holdT/2,R.pressure),0,1);
    const p=R.power, j=R.holding?(rnd()-.5)*p*10:0;
    R.tok.style.transform=`translate(-50%,-58%) rotate(${j}deg) scale(${1+p*.1})`;
    R.pw.style.setProperty("--p",p.toFixed(3));
    R.pw.classList.toggle("on",R.holding);
    R.speed=R.holding?1.5+p*5:0; // con thú giậm chân tại chỗ theo lực
    tickBubble(R.goose,dt);
  }
  function spinRing(){
    R.spun=true;
    const p=R.power;
    // Bốc người thắng đúng lúc thả tay, bằng seed mới lấy từ nguồn ngẫu nhiên mã hoá
    freshSeed();
    R.win=pick(R.cands);
    R.targetA=R.slices?R.win*R.seg+R.seg/2+between(-.3,.3)*R.seg:R.win*R.seg;
    // nhấn nhẹ nhất: 7-9 vòng, mạnh nhất: 15-17 vòng (phần lẻ bốc ngẫu nhiên)
    const laps=7+Math.round(p*8)+Math.floor(rnd()*3);
    R.total=laps*2*Math.PI+(((R.targetA-R.a0)%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
    R.TT=9+laps*.7+between(-.8,.8);
    R.tok.classList.remove("armed"); R.tok.style.transform=""; R.tok.disabled=true;
    R.pw.classList.remove("on"); R.pw.classList.add("spent");
    R.goose.bubble.classList.remove("on");
    honk(1+p*.4);
    $("status5").textContent=`Lực ${Math.round(p*100)}% · ${laps} vòng. Con ${noun()} đang chọn chủ nhân ${prizeName()}…`;
    loop(R.my,tickRing);
  }
  function placeRing(a,r){
    const [x,y]=R.P(a,r);
    R.goose.el.style.transform=`translate(${x-R.gw/2}px,${y-R.gh*(R.slices?.6:.8)}px)`;
    R.goose.spr.style.transform=Math.cos(a)<0?"scaleX(-1)":"";
  }
  function tickRing(dt){
    R.t+=dt;
    if(!R.done){
      // chậm dần rất lâu ở cuối, lướt qua từng người cho hồi hộp
      const p=Math.min(1,R.t/R.TT), e=1-Math.pow(1-p,4.2);
      R.a=R.a0+R.total*e;
      R.speed=R.total*4.2*Math.pow(1-p,3.2)/R.TT;
      if(!R.slowSaid&&p>.7){R.slowSaid=true;say(R.goose,line(R.goose,"slow"),1.8);}
      placeRing(R.a,R.track);
      const norm=((R.a%(2*Math.PI))+2*Math.PI)%(2*Math.PI), cur=(R.slices?Math.floor(norm/R.seg):Math.round(norm/R.seg))%R.k;
      if(cur!==R.cur){ const cls=R.slices?"on":"near"; if(R.seats[R.cur]) R.seats[R.cur].classList.remove(cls); R.seats[cur].classList.add(cls); R.cur=cur; blip(); }
      if(p>=1){
        R.done=true; R.speed=0; R.endT=R.t;
        const it=R.items[R.win];
        R.seats.forEach(s=>s.classList.remove("near","on")); R.seats[R.win].classList.add(R.slices?"win":"hit");
        say(R.goose,line(R.goose,"passWin"),2.2);
        honk(1.2); honk(1.2,.25);
        $("status5").textContent=`🎟️ ${it.name} ẵm ${prizeName()}!`;
        store.set("dua-ngong-lastwin",it.name);
      }
      return;
    }
    const since=R.t-R.endT; // nhún một cái về phía người thắng
    placeRing(R.a,R.track+(since<.6?Math.sin(since/.6*Math.PI)*R.gh*.9*(R.slices?-.5:1):0));
    tickBubble(R.goose,dt);
    if(since>1.6){
      const it=R.items[R.win];
      showResult({n:R.k,tint:false,label:`🎟️ Ẵm ${prizeName()}`,name:it.name,sp:R.goose.sp,color:it.color,num:0,order:null,again:"Tranh lại",
        removeText:R.k>2?`Loại "${it.name}", tranh tiếp`:null,copy:`🎟️ ${it.name} ẵm ${prizeName()}! (thú chọn ngẫu nhiên)`});
      return false;
    }
  }
  /* ---------- Mode: Giải đấu (cup) ---------- */
  // Mỗi trận có 2 ô; nguồn của ô là {team}, {bye} (miễn đấu), {win:id} hoặc {lose:id} của trận khác.
  // Kết quả lưu C.res[id] = [đội thắng hoặc DRAW, đội ô trên, đội ô dưới]. Đổi kết quả phía trước
  // làm đổi người ở trận sau thì kết quả trận sau tự bị xoá khi tính lại.
  const BYE=-1, DRAW="D";
  let C=null, cupZoom=clamp(parseFloat(store.get("dua-ngong-cupzoom","1"))||1,.55,1.6), cupPick=null, cupNoClick=false;

  function cupSetupInfo(){
    $("cupSizeWrap").hidden=cupBuild!=="random";
    $("cupHint").textContent={
      double:"Thua 2 trận mới bị loại: thua ở nhánh thắng thì rớt xuống nhánh thua. Vô địch nhánh thua gặp vô địch nhánh thắng ở chung kết tổng.",
      single:"Thua một trận là bị loại, thắng thì đi tiếp tới chung kết.",
      rr:"Đội nào cũng gặp nhau một lần. Thắng 3 điểm, hoà 1 điểm. Tối đa 16 đội."}[cupFmt];
    $("listHint").textContent=cupBuild==="preset"?"Mỗi dòng một đội, dạng  Tên đội: người 1, người 2  (không có dấu hai chấm thì chỉ có tên đội).":
      cupBuild==="random"?`Mỗi dòng một người, tự ghép ngẫu nhiên thành các đội ${cupSize} người.`:"Mỗi dòng một người (hoặc một đội). Danh sách được giữ lại cho lần sau.";
    const old=cupLoad(), btn=$("cupResume"); btn.hidden=!old;
    if(old){const done=Object.keys(old.res).length; btn.textContent=`▶ Mở lại "${old.name}" (${FMT_LABEL[old.fmt]}, ${old.teams.length} đội${done?`, đã có ${done} kết quả`:""})`;}
    $("cupShuffle").checked=cupShuffle;
  }
  [["cupfmt",v=>{cupFmt=v;store.set("dua-ngong-cupfmt",v);}],["cupbuild",v=>{cupBuild=v;store.set("dua-ngong-cupbuild",v);}],
   ["cupsize",v=>{cupSize=+v;store.set("dua-ngong-cupsize",v);}]].forEach(([k,set])=>
    document.querySelectorAll(`[data-${k}]`).forEach(b=>b.addEventListener("click",()=>{set(b.dataset[k]);applyMode();})));
  $("cupShuffle").addEventListener("change",e=>{cupShuffle=e.target.checked;store.set("dua-ngong-cupshuf",cupShuffle?"1":"0");});
  $("cupName").value=store.get("dua-ngong-cupname","");
  $("cupName").addEventListener("input",()=>store.set("dua-ngong-cupname",$("cupName").value));
  $("cupResume").addEventListener("click",()=>{const d=cupLoad(); if(d){C=d;cupPrep();openCup();}});

  // Danh sách -> các đội {name, members}
  function cupTeamsFromList(){
    const lines=parse();
    if(cupBuild==="preset") return lines.map((l,i)=>{
      const k=l.indexOf(":"); if(k<0) return {name:l,members:[]};
      return {name:l.slice(0,k).trim()||`Đội ${i+1}`,members:l.slice(k+1).split(/[,;]/).map(x=>x.trim()).filter(Boolean)};
    });
    if(cupBuild==="random"){
      const ppl=shuffle(lines), m=cupTeamCount(ppl.length), teams=[...Array(m)].map((_,i)=>({name:`Đội ${i+1}`,members:[]}));
      ppl.forEach((nm,i)=>teams[i%m].members.push(nm)); // dư người thì vài đội hơn 1 người
      return teams;
    }
    return lines.map(l=>({name:l,members:[]}));
  }
  function goCup(){
    const old=cupLoad();
    if(old&&Object.keys(old.res).length&&!cupArmed){cupArmed=true;$("go").textContent="Bấm lần nữa để tạo giải mới (giải đang dở sẽ mất)";return;}
    cupArmed=false;
    startCupWith(cupTeamsFromList(),$("cupName").value.trim());
  }
  function startCupWith(teams,name){
    if(teams.length<2) return fail("Cần ít nhất 2 đội.");
    if(cupFmt==="rr"&&teams.length>16) return fail("Vòng tròn tối đa 16 đội. Chọn Nhánh thắng/thua hoặc Loại trực tiếp nhé.");
    teams=teams.map(t=>({name:t.name,members:t.members||[]}));
    if(cupShuffle) teams=shuffle(teams); // không xáo thì dòng đầu là hạt giống số 1
    teams.forEach((t,i)=>t.color=COLORS[i%COLORS.length]);
    C={v:1,name:name||"Giải đấu",fmt:cupFmt,teams,res:{},undo:[],logged:null,at:Date.now()};
    cupPrep(); cupSave(); openCup();
    $("cupStatus").textContent=cupHelp();
  }
  $("teamToCup").addEventListener("click",()=>{
    if(!T) return;
    startCupWith(T.gates.map(g=>({name:g.name,members:g.members.map(r=>r.name)})),$("cupName").value.trim()||"Giải chia team");
  });
  function cupLoad(){
    try{
      const d=JSON.parse(store.get(CUP_KEY,"null"));
      if(!d||!Array.isArray(d.teams)||d.teams.length<2||!FMT_LABEL[d.fmt]) return null;
      d.res=d.res||{}; d.undo=Array.isArray(d.undo)?d.undo:[]; return d;
    }catch(e){return null;}
  }
  function cupSave(){const {M,num,sOut,byeish,...d}=C; store.set(CUP_KEY,JSON.stringify(d));}
  function cupPrep(){
    const n=C.teams.length;
    if(!Array.isArray(C.seat)||C.seat.length!==n) C.seat=[...Array(n).keys()]; // vị trí k trên bảng là đội C.seat[k]
    C.M=buildCup(n,C.fmt,C.seat);
    // trạng thái tĩnh (khi chưa có kết quả nào) để đánh số trận và biết trận nào miễn đấu
    const res=C.res; C.res={}; C.sOut=cupCompute().out; C.res=res;
    const key=m=>m.b==="W"?m.r*2-1:m.b==="L"?m.r+1.5:m.b==="G"?1000+m.r:m.r;
    // trận có một bên chắc chắn miễn đấu thì không phải trận thật, không đánh số
    C.byeish=C.sOut.map(o=>o.st==="dead"||o.a===BYE||o.b===BYE);
    const ids=C.M.map((m,i)=>i).filter(i=>!C.byeish[i])
      .sort((x,y)=>key(C.M[x])-key(C.M[y])||C.M[x].i-C.M[y].i);
    C.num={}; ids.forEach((id,k)=>C.num[id]=k+1);
  }
  // vị trí chuẩn của hạt giống: hạt 1 gặp hạt cuối, hạt 1 và 2 chỉ gặp nhau ở chung kết
  function seedOrder(P){let o=[1]; while(o.length<P){const m=o.length*2+1; o=o.flatMap(x=>[x,m-x]);} return o;}
  function buildCup(n,fmt,seat){
    seat=seat||[...Array(n).keys()];
    const M=[], add=m=>{m.id=M.length;M.push(m);return m.id;};
    if(fmt==="rr"){ // xếp lịch vòng tròn kiểu xoay vòng, lẻ đội thì mỗi vòng một đội nghỉ
      let ids=seat.slice(); if(n%2) ids.push(BYE);
      const N=ids.length;
      for(let r=1;r<N;r++){
        for(let i=0;i<N/2;i++){const a=ids[i],b=ids[N-1-i]; if(a!==BYE&&b!==BYE) add({b:"R",r,i,src:[{team:a},{team:b}]});}
        ids=[ids[0],ids[N-1],...ids.slice(1,N-1)];
      }
      return M;
    }
    const k=Math.max(1,Math.ceil(Math.log2(n))), P=1<<k, so=seedOrder(P), W=[];
    W[1]=[]; for(let i=0;i<P/2;i++){const a=so[2*i]-1,b=so[2*i+1]-1; W[1].push(add({b:"W",r:1,i,src:[a<n?{team:seat[a],seat:a}:{bye:1},b<n?{team:seat[b],seat:b}:{bye:1}]}));}
    for(let r=2;r<=k;r++){W[r]=[]; for(let i=0;i<P>>r;i++) W[r].push(add({b:"W",r,i,src:[{win:W[r-1][2*i]},{win:W[r-1][2*i+1]}]}));}
    if(fmt==="single") return M;
    let prev=null, q=0;
    if(k>=2){
      q=1; let cur=[];
      for(let i=0;i<P/4;i++) cur.push(add({b:"L",r:q,i,src:[{lose:W[1][2*i]},{lose:W[1][2*i+1]}]}));
      prev=cur;
      for(let r=2;r<=k;r++){
        // người thắng nhánh thua gặp người vừa rớt từ vòng r nhánh thắng (đảo thứ tự xen kẽ cho khỏi gặp lại sớm)
        q++; const drops=W[r].slice(); if(r%2===0) drops.reverse(); cur=[];
        for(let i=0;i<prev.length;i++) cur.push(add({b:"L",r:q,i,src:[{win:prev[i]},{lose:drops[i]}]}));
        prev=cur;
        if(r<k){q++; cur=[]; for(let i=0;i<prev.length/2;i++) cur.push(add({b:"L",r:q,i,src:[{win:prev[2*i]},{win:prev[2*i+1]}]})); prev=cur;}
      }
    }
    const wf=W[k][0], gf=add({b:"G",r:1,i:0,src:[{win:wf},k>=2?{win:prev[0]}:{lose:wf}]});
    add({b:"G",r:2,i:0,src:[{win:gf},{lose:gf}],reset:1}); // chỉ đá nếu đội từ nhánh thua thắng chung kết tổng
    return M;
  }
  function cupCompute(){
    const out=C.M.map(()=>({})); let cleared=0;
    const val=s=>s.team!=null?s.team:s.bye?BYE:s.win!=null?out[s.win].w:out[s.lose].l;
    const drop=i=>{if(C.res[i]!=null){delete C.res[i];cleared++;}};
    C.M.forEach((m,i)=>{
      const o=out[i];
      if(m.reset){const g=out[m.src[0].win]; if(g.st!=="done"||g.w!==g.b){o.st="off";drop(i);return;}}
      o.a=val(m.src[0]); o.b=val(m.src[1]);
      if(o.a===undefined||o.b===undefined){o.st="wait";drop(i);return;}
      if(o.a===BYE&&o.b===BYE){o.w=o.l=BYE;o.st="dead";return;}
      if(o.a===BYE||o.b===BYE){o.w=o.a===BYE?o.b:o.a;o.l=BYE;o.st="bye";return;}
      // kết quả chỉ còn hiệu lực khi đúng 2 đội đã đấu (đổi người ở trận trước thì phải nhập lại)
      const r=C.res[i], rw=Array.isArray(r)?r[0]:r, same=!Array.isArray(r)||(r[1]===o.a&&r[2]===o.b)||(r[1]===o.b&&r[2]===o.a);
      if(r!=null&&same&&rw===DRAW&&m.b==="R"){o.st="done";o.draw=true;return;}
      if(r!=null&&same&&(rw===o.a||rw===o.b)){o.w=rw;o.l=rw===o.a?o.b:o.a;o.st="done";return;}
      drop(i); o.st="ready";
    });
    return {out,cleared};
  }
  function rrTable(out){
    const rows=C.teams.map((t,i)=>({i,p:0,w:0,d:0,l:0,pts:0}));
    C.M.forEach((m,id)=>{const o=out[id]; if(o.st!=="done") return; const A=rows[o.a],B=rows[o.b]; A.p++;B.p++;
      if(o.draw){A.d++;B.d++;A.pts++;B.pts++;} else {const W=rows[o.w],L=rows[o.l]; W.w++;W.pts+=3;L.l++;}});
    return rows.slice().sort((x,y)=>y.pts-x.pts||y.w-x.w||x.l-y.l||x.i-y.i);
  }
  // nhà vô địch và á quân (chỉ số đội), chưa xong thì null
  function cupPodium(out){
    if(C.fmt==="rr"){ if(C.M.some((m,i)=>out[i].st!=="done")) return null; const t=rrTable(out); return {w:t[0].i,r:t[1]?t[1].i:null}; }
    if(C.fmt==="single"){ const o=out[C.M.length-1]; return o.st==="done"||o.st==="bye"?{w:o.w,r:o.l===BYE?null:o.l}:null; }
    const g1=out[C.M.length-2], g2=out[C.M.length-1];
    if(g2.st==="done") return {w:g2.w,r:g2.l};
    if(g1.st==="done"&&g1.w===g1.a) return {w:g1.w,r:g1.l};
    return null;
  }
  const cupHelp=()=>"Bấm nút Thắng cạnh đội thắng, đội kia tự xuống nhánh thua. Kéo thẻ đội vào ô ✅ Thắng / ❌ Thua cũng được.";
  function openCup(){ session++; endPick(); setSwap(false); show(scr.cup); renderCup(); }
  function pushUndo(){C.undo.push(JSON.stringify({res:C.res,seat:C.seat})); if(C.undo.length>60) C.undo.shift();}
  // Đổi chỗ: đổi vị trí 2 đội ở vòng 1 (kể cả đội đang được miễn đấu). Trận bị đổi người thì kết quả tự xoá.
  let cupSwap=false, swapSel=null;
  function setSwap(on){
    cupSwap=on; swapSel=null;
    $("cupSwap").setAttribute("aria-pressed",String(on)); $("cupSwap").textContent=on?"✓ Xong đổi chỗ":"🔀 Đổi chỗ";
    $("cupView").classList.toggle("swap-mode",on);
  }
  function swapSeats(k1,k2){
    if(k1===k2) return;
    const a=C.seat[k1], b=C.seat[k2]; pushUndo();
    C.seat[k1]=b; C.seat[k2]=a; cupPrep(); swapSel=null;
    const cleared=renderCup();
    $("cupStatus").textContent=`🔀 Đã đổi chỗ ${C.teams[a].name} và ${C.teams[b].name}`+(cleared?` · đã xoá kết quả ${cleared} trận vì đổi người`:"");
    blip();
  }
  $("cupSwap").addEventListener("click",()=>{
    if(!C) return; endPick(); setSwap(!cupSwap); renderCup();
    $("cupStatus").textContent=cupSwap?"Bấm 2 đội ở vòng 1 (hoặc kéo đội này thả lên đội kia) để đổi chỗ, kể cả đội đang được miễn đấu. Xong thì bấm ✓ Xong đổi chỗ.":cupHelp();
  });

  function teamCard(v,interactive,m){
    const t=C.teams[v], el=document.createElement(interactive?"button":"div");
    el.className="tcard"; if(interactive){el.type="button"; el.dataset.mid=m.id; el.dataset.team=v;}
    const sw=document.createElement("i"); sw.className="sw"; sw.style.background=t.color; el.appendChild(sw);
    const tx=document.createElement("span"); tx.className="tx";
    const tn=document.createElement("span"); tn.className="tn"; tn.textContent=t.name; tx.appendChild(tn);
    if(t.members.length){const sm=document.createElement("small"); sm.textContent=t.members.join(", "); tx.appendChild(sm);}
    el.appendChild(tx);
    if(interactive) el.setAttribute("aria-label",`${t.name}${t.members.length?" ("+t.members.join(", ")+")":""}, chọn kết quả trận ${C.num[m.id]||""}`);

  // Toàn màn hình (iPhone không hỗ trợ thì ẩn nút, bảng vẫn chiếm hết bề ngang)
  const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
  $("cupFull").hidden=!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
  $("cupFull").addEventListener("click",()=>{
    const d=document.documentElement;
    try{ if(fsEl()) (document.exitFullscreen||document.webkitExitFullscreen).call(document); else (d.requestFullscreen||d.webkitRequestFullscreen).call(d); }catch(e){}
  });
  const fsText=()=>{$("cupFull").textContent=fsEl()?"⛶ Thoát toàn màn hình":"⛶ Toàn màn hình";};
  document.addEventListener("fullscreenchange",fsText); document.addEventListener("webkitfullscreenchange",fsText);
})();

</script>
</body>
</html>
